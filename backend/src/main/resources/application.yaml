spring:
  application:
    name: backend
  datasource:
    url: ${CREATORHUB_DB_URL}
    username: ${CREATORHUB_DB_USERNAME}
    password: ${CREATORHUB_DB_PASSWORD}
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 5MB
creatorhub:
  upload-directory: ${CREATORHUB_UPLOAD_DIRECTORY:uploads}
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
