<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CreatorHub · 作品集</title>
    <link rel="stylesheet" href="/app/styles.css">
    <script type="module" src="/app/app.js"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">跳转到内容</a>
    <header class="site-header">
        <div class="wrap header-inner">
            <a class="brand" href="#works"><span class="brand-mark" aria-hidden="true">C</span>CreatorHub</a>
            <nav aria-label="主导航">
                <a id="works-nav" href="#works">探索作品</a>
                <a id="favorites-nav" href="#favorites">我的收藏</a>
            </nav>
            <div class="account">
                <span id="current-user" hidden></span>
                <button id="new-work" type="button" hidden>创建作品</button>
                <button id="register" type="button" class="secondary">注册</button>
                <button id="login" type="button">登录</button>
                <button id="logout" type="button" hidden>退出</button>
            </div>
        </div>
    </header>
    <main class="wrap" id="main-content">
        <p id="notice" class="notice" role="status" hidden></p>
        <section id="works-view" aria-labelledby="works-title">
            <div class="hero">
                <div class="hero-art" aria-hidden="true"></div>
                <div class="hero-copy">
                    <h1 id="works-title" tabindex="-1">探索作品</h1>
                    <p>按标题或标签发现创作，收藏你想再看的作品。</p>
                </div>
            </div>
            <form id="search" class="search">
                <div>
                    <label for="keyword">作品标题</label>
                    <input id="keyword" type="search" maxlength="200" placeholder="搜索作品标题">
                </div>
                <div>
                    <label for="tag">标签</label>
                    <select id="tag"><option value="">全部标签</option></select>
                </div>
                <button type="submit">搜索</button>
                <button type="reset" class="secondary">清空</button>
            </form>
            <p id="tag-status" role="status" hidden></p>
            <div id="works-results"></div>
        </section>
        <section id="detail-view" aria-labelledby="detail-title" hidden>
            <a class="back-link" id="detail-back" href="#works">← 返回作品列表</a>
            <div id="detail-content"></div>
        </section>
        <section id="favorites-view" aria-labelledby="favorites-title" hidden>
            <div class="section-heading">
                <h1 id="favorites-title" tabindex="-1">我的收藏</h1>
            </div>
            <div id="favorites-results"></div>
        </section>
    </main>
    <footer class="wrap footer"><a href="#works">CreatorHub</a></footer>
    <dialog id="login-dialog" aria-labelledby="login-title">
        <form id="login-form">
            <h2 id="login-title">登录 CreatorHub</h2>
            <label for="username">用户名</label>
            <input id="username" name="username" autocomplete="username" required maxlength="50">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <p id="login-error" class="error" role="alert" hidden></p>
            <div class="dialog-actions">
                <button type="button" id="cancel-login" class="secondary">取消</button>
                <button type="submit">登录</button>
            </div>
        </form>
    </dialog>
    <dialog id="register-dialog" aria-labelledby="register-title">
        <form id="register-form">
            <h2 id="register-title">创建账户</h2>
            <label for="register-username">用户名</label>
            <input id="register-username" name="username" autocomplete="username" required
                   minlength="3" maxlength="50" pattern="[A-Za-z0-9_]{3,50}" aria-describedby="username-help">
            <p id="username-help" class="meta">3 至 50 位英文字母、数字或下划线。</p>
            <label for="register-password">密码</label>
            <input id="register-password" name="password" type="password" autocomplete="new-password"
                   required minlength="8" maxlength="72" aria-describedby="password-help">
            <p id="password-help" class="meta">至少 8 个字符，UTF-8 编码不超过 72 字节。</p>
            <p class="error" role="alert" hidden></p>
            <div class="dialog-actions">
                <button type="button" class="secondary" data-close>取消</button>
                <button type="submit">注册</button>
            </div>
        </form>
    </dialog>
    <dialog id="work-dialog" class="editor-dialog" aria-labelledby="work-form-title">
        <form id="work-form">
            <h2 id="work-form-title">创建作品</h2>
            <label for="work-title">标题</label>
            <input id="work-title" name="title" required>
            <label for="work-intro">简介 <span class="meta">（选填）</span></label>
            <textarea id="work-intro" name="intro" rows="2"></textarea>
            <label for="work-body">正文</label>
            <textarea id="work-body" name="content" rows="7" required></textarea>
            <p class="error" role="alert" hidden></p>
            <div class="dialog-actions">
                <button type="button" class="secondary" data-close>取消</button>
                <button type="submit">保存作品</button>
            </div>
        </form>
    </dialog>
    <dialog id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-description">
        <form id="delete-form">
            <h2 id="delete-title">删除作品</h2>
            <p id="delete-description"></p>
            <p class="error" role="alert" hidden></p>
            <div class="dialog-actions">
                <button type="button" class="secondary" data-close autofocus>取消</button>
                <button type="submit" class="danger">确认删除</button>
            </div>
        </form>
    </dialog>
    <dialog id="upload-dialog" aria-labelledby="upload-title">
        <form id="upload-form">
            <h2 id="upload-title">上传作品图片</h2>
            <label for="image-file">图片文件</label>
            <input id="image-file" type="file" name="file" accept="image/jpeg,image/png" required
                   aria-describedby="image-help">
            <p id="image-help" class="meta">JPEG 或 PNG，最多 5 MiB，宽高均不超过 4096 像素。</p>
            <p class="error" role="alert" hidden></p>
            <div class="dialog-actions">
                <button type="button" class="secondary" data-close>取消</button>
                <button type="submit">上传</button>
            </div>
        </form>
    </dialog>
</body>
</html>
